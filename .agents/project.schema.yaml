# GENERATED by `bun run agents:schema` from .agents/project.yaml. DO NOT EDIT BY HAND.
#
# This is the TEMPLATE a consumer project is compared against, not a file any
# project reads at runtime. `bun sync` diffs a project's own
# .agents/project.yaml against this one and reports the key paths upstream has
# added since that project was scaffolded; `bun run setup:doctor` reports the
# same thing as a diagnosis, and the scaffolder seeds a new project's
# .agents/project.yaml from it. Values here are methodology defaults or `null`
# placeholders — never the maintainer's identity, which `agents:schema`
# refuses to emit.
#
# To change it: edit .agents/project.yaml, then run `bun run agents:schema`.
# `bun run agents:schema:check` fails the commit when the two disagree.

project:
  project_name: null # TODO: fill per project — Project name (e.g. MyProject)
  project_key: null # TODO: fill per project — Project key in issue tracker (e.g. PROJ, OB, UPEX)
  webapp_domain: null # TODO: fill per project — Domain of the web application under test (e.g. myproject.com)

backend:
  backend_repo: null # TODO: fill per project — Relative path to backend repository (e.g. ../my-backend)
  backend_stack: null # TODO: fill per project — Backend technology stack (e.g. Node.js + Express)
  backend_entry: null # TODO: fill per project — Backend source entry point (e.g. src/)

frontend:
  frontend_repo: null # TODO: fill per project — Relative path to frontend repository (e.g. ../my-frontend)
  frontend_stack: null # TODO: fill per project — Frontend technology stack (e.g. React + TypeScript)
  frontend_entry: null # TODO: fill per project — Frontend source entry point (e.g. src/)
  design_md_path: null # OPTIONAL — path to DESIGN.md produced by /design-system. Defaults to ./DESIGN.md when null. Override only for atypical layouts (e.g. .context/DESIGN.md).

database:
  db_type: null # TODO: fill per project — Database engine (e.g. PostgreSQL)

# The application's REAL stack, structured, so a skill reads a value instead of
# hardcoding one. Ships the GREENFIELD defaults (what /project-bootstrap scaffolds:
# Next.js App Router + Supabase on bun, deployed to Vercel); an existing app replaces
# them with what it actually runs. Re-detected and written by
# `bun run agents:setup --stack`; checked against the repo by `bun run setup:doctor`.
# Rule for a skill: an app command is `<package_manager> run <scripts.X>`; a null script
# means the app has none, so the step is skipped and said so, never invented.
# Read by path (`stack.database.schema_source`), never as a bare {{VAR}}.
stack:
  app_root: . # directory holding the app's package.json, relative to the repo root (monorepo: e.g. apps/web)
  framework: nextjs-app-router # nextjs-app-router | nextjs-pages | other
  package_manager: bun # bun | pnpm | npm | yarn
  scripts: # script NAMES in the app's package.json; null = the app has no such script
    dev: dev
    build: build
    lint: lint:check
    types: types:check
    test: test
    db_types: db:types
  database:
    engine: postgres # postgres | other | none
    provider: supabase # supabase | other | none
    schema_source: live # live | migrations. Which one project-context trusts: the database itself (through the db MCP) or the migration files in migrations_dir
    migrations_dir: null # directory of migration files, relative to app_root; null = none in the repo (the db MCP's migration list is the ledger)
    migrations_tool: supabase-mcp # supabase-mcp | supabase-cli | prisma | drizzle | none. How a schema change is applied
    types_path: src/types/supabase.ts # generated database types, relative to app_root; null = none
  ui:
    css: tailwind-v3 # tailwind-v3 | tailwind-v4 | css-modules | other
    kit: shadcn # shadcn | other | none
    icons: lucide # lucide | other | none
  hosting: vercel # vercel | netlify | other | none
  ci: github-actions # github-actions | gitlab | other | none
  test_runner: null # vitest | jest | bun | playwright | other | none; null = not chosen yet (/unit-testing picks one)
  conventions:
    import_alias: '@/' # path alias the app's tsconfig declares for its source root; null = none
    testid_style: null # the app's existing test-id attribute and case (e.g. data-testid kebab-case); null = not established. Skills never rename an existing test id

issue_tracker:
  issue_tracker: null # TODO: fill per project — Issue tracking tool (e.g. Jira)
  issue_tracker_cli: null # TODO: fill per project — CLI command to query tickets (e.g. acli (Jira) / gh issue (GitHub))
  # SOURCE OF TRUTH for the Atlassian instance. Every jira:sync-* script resolves the
  # host from HERE first and uses .env's ATLASSIAN_URL only as a fallback (see
  # cli/lib/atlassian-instance.ts). Inverse of project_key, on purpose: the host is
  # project identity, not a per-developer override, and it is the value that goes stale
  # after a site migration — a stale host silently overwrites .context/PBI/ and the
  # .agents/*.json catalogs with another site's content. Keep it identical to .env's
  # ATLASSIAN_URL; when they disagree the yaml wins and the scripts print a warning.
  atlassian_url: null # TODO: fill per project — Atlassian instance base URL (e.g. https://company.atlassian.net). The acli `--site` slug is derived from this (strip `https://`); no separate ATLASSIAN_SITE variable.

testing:
  default_env: null # TODO: fill per project — Default working environment — must match a key under `environments:` (e.g. staging)
  # Identity used by ANY automation that drives the running app as a user:
  # live-UI validation, smoke checks, authenticated HTTP probes.
  # Skills read VARIABLE NAMES from here and resolve the values from `.env` at
  # runtime — never put a credential value in this file (it is committed).
  # FAIL-CLOSED: if `email_var` / `password_var` are null, /sprint-development
  # STOPS before any live-UI run instead of improvising a login.
  # Contract + prohibitions: .agents/skills/sprint-development/references/live-ui-identity.md
  automation_identity:
    email_var: null # TODO: fill per project — env var NAME holding the automation account email (e.g. QA_E2E_USER_EMAIL)
    password_var: null # TODO: fill per project — env var NAME holding its password (e.g. QA_E2E_USER_PASSWORD)
    scope: null # TODO: fill per project — dedicated-non-production-account | shared-demo-account. Anything else (a real user, an admin, a staff account) is NOT a valid automation identity.
    # OPTIONAL per-environment overrides. Omit when one identity serves every env.
    # Keys must match `environments:` below. Example:
    # per_env:
    #   staging:
    #     email_var: STAGING_QA_USER_EMAIL
    #     password_var: STAGING_QA_USER_PASSWORD
    per_env: {}

# Host harnesses this project uses (ADR-0013), any of: claude, opencode, codex.
# Every compatibility gate (agents:compat:check, setup:doctor, the installer, `bun sync`)
# checks only these; the files of a harness left out may be deleted. null = detect from
# the files present (a harness is in use while ANY of its files exists). `bun setup`
# adds the agents you select (it never removes one); edit the list to drop one.
# The boilerplate itself always checks all three, whatever this says.
# Read directly by cli/lib/harness-selection.ts (not a {{VAR}} token) -> skipped by vars:check.
harnesses: null # TODO: e.g. [claude]

# Git workflow for THIS project — the SOURCE OF TRUTH read by the git-flow-master skill
# before any git/gh operation. Ships `solo-main` as a DEFAULT — `meta.strategy_source` says
# whether anyone chose it (`inherited` = scaffolder-reset placeholder; `chosen` = Strategy Setup
# ran). On `inherited` (or a null strategy) git-flow-master OFFERS "Strategy Setup" on the
# first git intent and fills these fields (it never auto-picks). Tracked + frozen by the
# updater (bootstrapOnly), so each project keeps its own. Filled by git-flow-master, NOT by
# `agents:setup`. These leaves are read directly (not {{VAR}} template vars) → skipped by vars:check.
git_strategy:
  strategy: solo-main # DEFAULT, not a decision — see meta.strategy_source. One of: solo-main | main-integration | enterprise | trunk-based | gitflow | github-flow | gitlab-flow
  description: >
    TODO: describe this project's branching strategy in prose: which branches are
    long-lived, how work reaches the release branch, and any operational note the AI
    needs before it runs a git command. Filled by the git-flow-master Strategy Setup
    questionnaire, or by hand.
  branches:
    production: main # release / default branch
    integration: null # long-lived integration branch name (e.g. staging), or null
    ephemeral_pattern: null # on-demand trunk pattern, or null
  protected: [main] # branches that are never force-pushed and never rewritten (AGENTS.md Critical Rule #5). Add the integration branch here too when the strategy has one.
  decisions: # captured by the Strategy Setup questionnaire (Q1/Q2/Q3)
    promote_method: n/a # ff-only | merge-commit | squash | n/a
    feature_merge: n/a # merge-commit | squash | rebase-merge | n/a
    hotfix_policy: n/a # branch-off-prod-backmerge | via-integration | none | n/a
  policy: # how strictly protected branches are guarded (set by Strategy Setup Q4; defaults are safe)
    direct_push_to_protected: confirm # forbidden | confirm | allowed. Ships `confirm` because meta.strategy_source is `inherited`: until Strategy Setup runs, nobody has authorized a direct push here.
    admin_bypass: false # true only when the push credential is on the host ruleset's bypass list. While false, a "Bypassed rule violations" line from the remote is a real finding, not noise.
    require_pr_reviews: 1 # required approving reviews on a protected branch. Reconcile against the host with `bun run git:policy verify`.
    # Host divergences that are ACCEPTED, not drift. Each `field` names a `git:policy verify`
    # finding verbatim (`<branch>.<policy_field>`); verify moves matching findings from DRIFT
    # to ACCEPTED (exit 0) and warns when an entry no longer matches anything (stale entry).
    # `apply` preserves the host's side for accepted fields instead of deriving its own rule.
    accepted_divergences: []
  branch_prefixes:
    precedence: [feat, fix, refactor, test, docs, chore]
    naming_with_key: '{prefix}/{ISSUE-KEY}-{kebab-slug}'
    naming_without_key: '{prefix}/{kebab-slug}'
  meta:
    setup_version: 1
    created: null # YYYY-MM-DD stamped by Strategy Setup
    policy_verified: null # YYYY-MM-DD of the last `bun run git:policy verify`. null = never reconciled against the host
    policy_source: declared # verified | accepted | declared. `verified` = host matches the yaml exactly; `accepted` = every divergence is formally listed in policy.accepted_divergences (stamped by `git:policy verify --stamp`); `declared` = never reconciled, or an unaccepted drift is open.
    # Did anyone actually CHOOSE this strategy, or is it just the shipped default?
    # `strategy:` above is never null, so its value alone cannot answer that. Strategy
    # Setup flips this to `chosen` when the questionnaire actually runs.
    strategy_source: inherited # inherited | chosen

# WHO decides what, when a question has no settled answer. Read by every skill that
# routes a decision, via agentic-dev-core/references/decision-protocol.md §5.1.
# `escalate` is the default and is correct for any project with a human product owner.
# Set `decide` ONLY for a project specified and built end-to-end by AI with no human PO
# in the loop — it replaces escalation category 1 with a scored, attributed decision
# subagent. Categories 2-4 (novel security posture, irreversible actions, anything the
# operator reserved) still escalate under BOTH settings.
decision_authority:
  product: escalate # escalate | decide. See decision-protocol.md §5.1 before changing.

# Scheduled / unattended delivery runs. Read by the `autonomous-delivery` skill at
# Phase 0 — that skill ships with the boilerplate, so the slot ships with it too.
# Every default here is the SAFE end of its axis: the master switch is off, and a
# project opts in deliberately rather than inheriting autonomy it never asked for.
# Full semantics: .agents/skills/autonomous-delivery/SKILL.md -> "Configuration".
autonomous_delivery:
  enabled: false # master switch. false -> every mode exits in Phase 0 with a report.
  modes: [story, bug, discovery] # modes this project permits. A mode not listed is rejected.
  caps:
    story: 1 # HARD. Raising this is a measured mistake, not a tuning knob.
    bug: 3 # sequential; each fully closed before the next starts.
    discovery: 0 # application CODE cap — always zero, discovery never writes code.
    discovery_definitions: 2 # NEW user stories drafted + created per run — created UNATTENDED (ADR-0007); this cap, not a human in the loop, bounds the blast radius.
  lock_staleness_minutes: 90 # older than this -> abandoned, reclaimable with a logged note.
  automation_gh_account: null # TODO: fill per project — gh identity asserted before every push and merge.
  migrations: confirm # confirm | autonomous | unrestricted. See "Migration gate".
  isolation: worktree # worktree | in-place. worktree is strongly preferred.
  context_budget:
    handoff_checkpoint: every-phase # every-phase | every-slice. Never "at-end".
    stop_at_remaining_pct: 20 # begin the clean-stop sequence at this much budget left.
  report_channel: null # null | tracker:<ISSUE-KEY> | file:<path>. Plain summary log for all three modes.
  escalation_channel: null # null | slack:<CHANNEL-ID>. ESCALATIONS ONLY — never summaries.
  escalation_log: .session/autonomous-delivery/escalation-log.md # append-only, shared across modes.

# Defaults for supervised multi-session worker fleets: one conductor session
# coordinating N persistent workers through the Orca runtime, or, with no
# runtime, the same launch lines pasted by hand. Read by the `orca-orchestration`
# skill. DEFAULTS only: an explicit instruction in the conductor session always
# wins for that run ("run three", "use opencode for this one").
# A missing block degrades, it does not break: cap 1, the harness defaults, and
# no orchestrator named. Full semantics: .agents/README.md -> "orchestration".
orchestration:
  max_workers: 3 # concurrent workers per round (merge + staging deploy stay serialized through the conductor)
  default_agent: claude # claude | codex | opencode
  # The WORKER model: the full provider model id, never an alias (an alias moves
  # on its own between rounds: gotcha G29). The name stays `default_model` for
  # compatibility (`bun sync` only inserts keys, it never renames one). Empty ''
  # is allowed only when the conductor reads the model off the worker's screen
  # at readiness and records it in the roster.
  default_model: claude-opus-5-5 # e.g. claude-opus-5-5
  default_effort: high # harness effort level when supported
  # The CONDUCTOR tier: the session the human types into, or a middle conductor
  # another session launched. Same rule as `default_model`: a full model id.
  conductor_model: claude-opus-5-5 # e.g. claude-opus-5-5
  conductor_effort: high # e.g. high
  # The SUBAGENT tier: one-shot dispatches inside a turn. Written in the
  # harness's own subagent vocabulary, never a full id: Claude Code's Agent tool
  # takes sonnet | opus | haiku | fable.
  subagent_model: sonnet # e.g. sonnet
  # Permission mode per tier, in the repo vocabulary bypass | auto | ask | inherit.
  # Translated per harness in ONE table:
  # .agents/skills/orca-orchestration/references/orca-machine-setup.md §3.1.
  # A supervised worker's REAL mode comes from the orchestrator app's per-agent
  # default arguments (the native launch takes no argv); this map declares what
  # the conductor verifies at readiness. Why these defaults and the security
  # tradeoff of `bypass`: .context/ADR/ADR-0020-agentic-work-profile-and-permission-posture.md.
  # A map, read by path (`orchestration.permission_modes.<tier>`), not a {{VAR}}.
  permission_modes:
    conductor: auto # e.g. auto
    worker: bypass # e.g. bypass
    subagent: inherit # e.g. inherit (the mode of the session that launches it)
  # Model by topic: the conductor matches a brief's topics against these entries
  # when it picks a model and effort for a tier. Empty = the tier defaults above.
  # Entry shape: {topics: [security, migration], tier: worker, model: <full id>, effort: max}
  # (tier: worker | conductor | subagent). A list, read by path, not a {{VAR}}.
  model_overrides: [] # e.g. [{topics: [security, migration], tier: worker, model: claude-opus-5-5, effort: max}]
  # WHICH orchestrator, named here instead of hardcoded in a skill. Empty
  # `orchestrator_cli` = no orchestrator on this machine: every workflow skill
  # falls back to the pasted-launch-line path and says NOTHING about it.
  orchestrator_name: Orca # the application the operator sees
  orchestrator_cli: orca # the binary on PATH (Linux outside a managed terminal: orca-ide)
  # THE TWO VERBS ARE NOT INTERCHANGEABLE. `message_verb` carries every message
  # BETWEEN sessions and is byte-intact. `terminal_verb` DRIVES a terminal
  # (commands, CLI calls, harness slash-commands, keystrokes): it truncates a
  # long payload silently, keeps only the TAIL, and still reports success.
  # One structural exception: a supervised worker's first prompt goes through
  # `terminal_verb`, because the native launch has no argv. Keep it short and
  # pointing at a file. Canon: orca-orchestration/references/channel-discipline.md.
  message_verb: orca orchestration # session-to-session messages ONLY
  terminal_verb: orca terminal # commands and keystrokes ONLY
  # Vendor skills the orchestrator installs at USER level, loaded ALONGSIDE the
  # repo's own `orca-orchestration` skill, never instead of it: the repo skill
  # owns WHEN and WHAT, these own the command grammar. Empty list = none
  # installed; the repo skill then asks the binary for its grammar.
  orchestrator_skills: [orca-cli, orchestration]

# Files `bun sync` must keep as THIS project's own. Read by `cli/update-boilerplate.ts`
# at the start of every run and merged into the protected watchlist (AGENTS.md,
# .agents/project.yaml, .mcp.json, .claude/settings.json, .husky/pre-commit,
# .husky/pre-push, ...): a listed path is never overwritten, is delivered once from
# upstream when missing, and shows a drift row with hunk evidence when upstream's
# copy changes. List a SYNCED file you merged by hand (the parity row "project edit
# overwritten" names the path to add); repo-relative FILE paths only, no directories,
# nothing under .git. An invalid entry is reported and ignored. Empty by default.
updater:
  protected_paths: [] # e.g. [scripts/lint-vars.ts, .agents/skills/acli/SKILL.md]

# Where SECRET values come from. `local` (the default) = .env / .env.local.
# A secret manager is the ADVANCED option (ADR-0011): `bun setup` writes the
# committed overlay .env.provider.schema (references only, never values).
# Read directly by the installer; not a {{VAR}} source.
secrets:
  provider: local # local | 1password
  onepassword:
    vault: null # vault the op:// references point at (e.g. myproject-dev; Private on a personal plan)
    account: null # sign-in shorthand from `op account list`; null = the CLI default account
    auth: app # app (desktop app locally, service account in CI) | service-account (token only)

# Variables declared above that are consumed OUTSIDE the {{TEMPLATE}} system
# (env vars in scripts/, shell `yq` reads embedded in skill docs, etc.).
# `bun run vars:check` skips DECLARED_BUT_UNUSED warnings for these.
# Each entry MUST include an inline `#` comment explaining WHERE the variable
# is consumed — if the comment is missing, the linter fails with
# EXTERNAL_CONSUMER_UNDOCUMENTED so the allowlist cannot rot silently.
external_consumers:
  - automation_identity # read DIRECTLY (not as a {{VAR}}) by .agents/skills/sprint-development/references/live-ui-identity.md + live-ui-validation.md — its leaves hold env-var NAMES, resolved from .env at runtime
  - decision_authority # key of the structured `decision_authority:` block, read directly by .agents/skills/agentic-dev-core/references/decision-protocol.md §5.1 — never resolved through {{VAR}} templating
  - product # key of the structured `decision_authority:` block, read directly by .agents/skills/agentic-dev-core/references/decision-protocol.md §5.1 — never resolved through {{VAR}} templating
  - autonomous_delivery # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - enabled # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - modes # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - caps # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - lock_staleness_minutes # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - automation_gh_account # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md Phase 0b step 3 (push-identity assertion) — never resolved through {{VAR}} templating
  - migrations # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - isolation # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - context_budget # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - report_channel # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - escalation_channel # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md Autonomy §Notifying an escalation — never resolved through {{VAR}} templating
  - escalation_log # key of the structured `autonomous_delivery:` block, read directly by .agents/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - updater # key of the structured `updater:` block, read directly by cli/update-boilerplate.ts (resolveProtectedWatchlist) at the start of every `bun sync`, never resolved through {{VAR}} templating
  - protected_paths # key of the structured `updater:` block, read directly by cli/lib/updater-drift.ts (projectProtectedPaths), never resolved through {{VAR}} templating
  - provider # key of the structured `secrets:` block, read directly by cli/lib/secret-providers.ts (parseSecretsConfig) from the installer's secret-manager step, never resolved through {{VAR}} templating
  - onepassword # key of the structured `secrets:` block, read directly by cli/lib/secret-providers.ts (parseSecretsConfig), never resolved through {{VAR}} templating
  - strategy_source # key of the structured `git_strategy.meta:` block, read directly by .agents/skills/git-flow-master (bootstrap trigger + Strategy Setup persist) — never resolved through {{VAR}} templating
  - default_env # consumed implicitly by the AI variable resolver (sets active env for {{WEB_URL}} / {{API_URL}} / ...) AND by scripts/agents-setup.ts via process.env.DEFAULT_ENV in --non-interactive mode
  - permission_modes # map key of the flat `orchestration:` block, read by path (`orchestration.permission_modes.<tier>`) by .agents/skills/orca-orchestration/SKILL.md (hard rule 5, §Defaults) and references/coordinator-playbook.md §1 readiness — never resolved through {{VAR}} templating
  - model_overrides # list key of the flat `orchestration:` block, read by path by .agents/skills/orca-orchestration/SKILL.md §Defaults when the conductor picks a tier's model — never resolved through {{VAR}} templating
  - orchestrator_skills # list key of the flat `orchestration:` block, read directly by .agents/skills/orca-orchestration/SKILL.md (Quick start step 2, Modes) as a list of user-level skills to load — never resolved through {{VAR}} templating
  - design_md_path # read by `yq '.frontend.design_md_path'` inside bash code fences of .agents/skills/{design-system/references/getdesign-matcher.md, project-bootstrap/references/frontend-setup.md}

# Per-environment config. Add/remove environments freely (production, dev, qa, uat, etc.).
# Each environment must define ALL three keys: web_url, api_url, db_project_ref.
# Prompts referencing {{WEB_URL}} / {{API_URL}} / {{DB_PROJECT_REF}} resolve to the
# active environment (`testing.default_env` above, or a session override).
# For explicit cross-env references use {{environments.<env>.<var>}} (e.g. {{environments.local.web_url}}).
environments:
  local:
    web_url: null # TODO: fill per project — Frontend URL for local env (e.g. http://localhost:3000)
    api_url: null # TODO: fill per project — API base URL for local env (e.g. http://localhost:3000/api)
    db_project_ref: null # TODO: fill per project — Supabase project ref for local (the 20-character id in your Supabase dashboard URL: supabase.com/dashboard/project/<ref>)
  staging:
    web_url: null # TODO: fill per project — Frontend URL for staging env (e.g. https://staging.myproject.com)
    api_url: null # TODO: fill per project — API base URL for staging env (e.g. https://api-staging.myproject.com)
    db_project_ref: null # TODO: fill per project — Supabase project ref for staging (the 20-character id in your Supabase dashboard URL: supabase.com/dashboard/project/<ref>)
