# Project configuration consumed by AI agents (Claude, Cursor, Gemini, Codex, etc.)
# when they encounter {{VAR_NAME}} references in prompts and docs.
# Variable names are snake_case; the AI maps {{PROJECT_NAME}} -> project.project_name lexically.
# Edit values manually.
# Every unfilled field is `null` plus a TODO comment with a concrete example.
#
# NOTE: This is the project-starter TEMPLATE. All values are intentionally `null`.
# Each downstream project that uses this starter must fill in the real values.

project:
  project_name: Bunkai # Brand name for the product (kanji 分解 — "the art of breaking down a kata into its applications").
  project_key: BK # Issue tracker key (Jira project key prefix).
  webapp_domain: bunkai.io # Primary production domain. Defensive domain bankai.io redirects here.

backend:
  backend_repo: . # Monorepo — backend lives in `app/api/` of the Next.js project for MVP. Spin out to a NestJS service when self-hosted Docker Compose lands (see SRS/architecture-specs.md).
  backend_stack: Next.js 15 (App Router, API routes) + Supabase # MVP cloud-validation stack. Self-hosted edition target: NestJS + Postgres + Redis + MinIO + Better Auth (Phase 2).
  backend_entry: app/api # Next.js API route handlers.

frontend:
  frontend_repo: . # Monorepo — same Next.js app.
  frontend_stack: Next.js 15 + React 19 + TypeScript + Tailwind + shadcn/ui + Monaco Editor + TanStack Table + React Flow # Editor for ATCs (Monaco). Table view (TanStack). Mind-map view (React Flow). Mind-map 3D (react-force-graph) is Phase 3.
  frontend_entry: app
  design_md_path: null # Defaults to ./DESIGN.md. Source mockups live in `.context/designs/bunkai-test-management-tool/`.

database:
  db_type: Supabase (PostgreSQL 16) # MVP. pgvector planned for semantic ATC search (Phase 2). Self-hosted edition uses plain Postgres in Docker.

issue_tracker:
  issue_tracker: Jira
  issue_tracker_cli: acli
  atlassian_url: upexgalaxy71.atlassian.net # acli `--site` slug derives from this (strip domain); no separate ATLASSIAN_SITE variable

testing:
  default_env: local # fill per project — Default working environment — must match a key under `environments:` (e.g. staging)
  automation_identity:
    email_var: QA_E2E_USER_EMAIL # dedicated non-production fixture, provisioned 2026-07-30 during BK-87 (see mem: convention/qa-e2e-credentials)
    password_var: QA_E2E_USER_PASSWORD
    scope: dedicated-non-production-account
    per_env: {} # same fixture works across local/staging/production (single-project Supabase tenancy for MVP)

# Variables declared above that are consumed OUTSIDE the {{TEMPLATE}} system
# (env vars in scripts/, shell `yq` reads embedded in skill docs, etc.).
# `bun run vars:check` skips DECLARED_BUT_UNUSED warnings for these.
# Each entry MUST include an inline `#` comment explaining WHERE the variable
# is consumed — if the comment is missing, the linter fails with
# EXTERNAL_CONSUMER_UNDOCUMENTED so the allowlist cannot rot silently.
external_consumers:
  - default_env # consumed implicitly by the AI variable resolver (sets active env for {{WEB_URL}} / {{API_URL}} / ...) AND by scripts/agents-setup.ts via process.env.DEFAULT_ENV in --non-interactive mode
  - design_md_path # read by `yq '.design_md_path'` inside bash code fences of .claude/skills/{design-system/references/getdesign-matcher.md, project-bootstrap/references/frontend-setup.md}
  - automation_identity # structured block (not a flat {{VAR}}), resolved by name per .claude/skills/sprint-development/references/live-ui-identity.md — email_var/password_var point at .env, never referenced via {{AUTOMATION_IDENTITY}} templating
  - decision_authority # key of the structured `decision_authority:` block, read directly by .claude/skills/agentic-dev-core/references/decision-protocol.md §5.1 — never resolved through {{VAR}} templating
  - product # key of the structured `decision_authority:` block, read directly by .claude/skills/agentic-dev-core/references/decision-protocol.md §5.1 — never resolved through {{VAR}} templating
  - autonomous_delivery # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - enabled # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - modes # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - caps # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - lock_staleness_minutes # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - automation_gh_account # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md Phase 0b step 3 (push-identity assertion) — never resolved through {{VAR}} templating
  - migrations # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - isolation # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - context_budget # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - report_channel # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating
  - escalation_channel # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Autonomy (clean-stop sequence, primary notification path) — never resolved through {{VAR}} templating
  - escalation_log # key of the structured `autonomous_delivery:` block, read directly by .claude/skills/autonomous-delivery/SKILL.md §Configuration — never resolved through {{VAR}} templating

# Per-environment config. Add/remove environments freely (production, dev, qa, uat, etc.).
# Each environment must define ALL three keys: web_url, api_url, db_project_ref.
# Prompts referencing {{WEB_URL}} / {{API_URL}} / {{DB_PROJECT_REF}} resolve to the
# active environment (`testing.default_env` above, or a session override).
# For explicit cross-env references use {{environments.<env>.<var>}} (e.g. {{environments.local.web_url}}).
environments:
  local:
    web_url: 'http://localhost:3000' # fill per project — Frontend URL for local env (e.g. http://localhost:3000)
    api_url: 'http://localhost:3000/api' # fill per project — API base URL for local env (e.g. http://localhost:3000/api)
    db_project_ref: fmbpikzpkafptqximhxn # Supabase project ref (visible in dashboard URL); single-project tenancy across envs for MVP
  staging:
    web_url: https://staging-upexbunkai.vercel.app # Vercel preview alias for the staging branch
    api_url: https://staging-upexbunkai.vercel.app/api # Same host as staging web; API mounted under /api
    db_project_ref: fmbpikzpkafptqximhxn # Same Supabase project as local/prod for MVP (single-project tenancy)
  production:
    web_url: https://upexbunkai.vercel.app # Vercel production alias (defensive bunkai.io to be wired post-MVP)
    api_url: https://upexbunkai.vercel.app/api # Same host as production web; API mounted under /api
    db_project_ref: fmbpikzpkafptqximhxn # Same Supabase project as local/staging for MVP

# Git workflow for THIS project — the SOURCE OF TRUTH read by the git-flow-master skill
# before any git/gh operation. Ships `null` (template): on the first git intent git-flow-master
# OFFERS "Strategy Setup" and fills these fields (it never auto-picks). Tracked + frozen by the
# updater (bootstrapOnly), so each project keeps its own. Filled by git-flow-master, NOT by
# `agents:setup`. These leaves are read directly (not {{VAR}} template vars) → skipped by vars:check.
git_strategy:
  strategy: main-integration # null until Strategy Setup runs; then one of: solo-main | main-integration | enterprise | trunk-based | gitflow | github-flow | gitlab-flow
  description: >
    Two long-lived branches: main (production, Vercel prod env) and staging
    (integration, Vercel staging env). All feature/* and fix/* work branches off
    staging, merges back via --no-ff PR. Release = fast-forward promotion of staging
    to main, keeping the two branches byte-identical. Core invariant: main MUST always
    be an ancestor of staging. Urgent hotfixes branch off main, PR to main, then
    back-merge to staging the same day to restore the invariant.
  branches:
    production: main # release / default branch
    integration: staging # long-lived integration branch name (e.g. staging), or null
    ephemeral_pattern: null # on-demand trunk pattern, or null
  protected: [main, staging] # branches requiring explicit confirm before a direct push
  decisions: # captured by the Strategy Setup questionnaire (Q1/Q2/Q3)
    promote_method: ff-only # ff-only | merge-commit | squash | n/a
    feature_merge: merge-commit # merge-commit | squash | rebase-merge | n/a
    hotfix_policy: branch-off-prod-backmerge # branch-off-prod-backmerge | via-integration | none | n/a
  policy: # how strictly protected branches are guarded (set by Strategy Setup Q4; defaults are safe)
    direct_push_to_protected: confirm # forbidden | confirm | allowed — ACCEPTED DIVERGENCE from the host, which requires a PR on main/staging via ruleset. Rationale in CLAUDE.md § Git Strategy; do not re-raise as drift.
    admin_bypass: true # team POLICY: a repo admin MAY bypass PR/protection for urgent changes — offer is enabled. Actual capability still depends on the GitHub user's role, and git-flow-master re-confirms BOTH (a) operator is really a repo admin and (b) the specific action, at runtime, every time — this flag does not make bypass silent or automatic.
    require_pr_reviews: 0 # null | 0 | N — min approvals before merge to a protected branch (informational)
  branch_prefixes:
    precedence: [feat, fix, refactor, test, docs, chore]
    naming_with_key: '{prefix}/{ISSUE-KEY}-{kebab-slug}'
    naming_without_key: '{prefix}/{kebab-slug}'
  meta:
    setup_version: 2
    created: 2026-06-24 # YYYY-MM-DD stamped by Strategy Setup
    policy_verified: 2026-08-22 # YYYY-MM-DD of the last reconciliation of `policy:` against the host (git-flow-master Step 1b). null = never verified. Per-project — this file is a template; a fresh project starts unverified
    policy_source: verified # verified | declared — `declared` means `policy:` records team INTENT and has never been checked against the remote. Never state what the remote requires from a `declared` reading

# WHO decides what, when a question has no settled answer. Read by every skill that
# routes a decision, via agentic-dev-core/references/decision-protocol.md §5.1.
# `decide` here is the config form of CLAUDE.md Critical Rule #18: Bunkai TMS is
# specified and built end-to-end by AI with no human PO in the loop, so an open
# product/business/functional question is work to do, not a blocker. It used to live
# as a ~240-line fork across three synced skill files, which `bun run up` overwrote
# on every sync; the boilerplate now gates the same behaviour on this key, and this
# file is bootstrapOnly so the updater never touches it.
# Categories 2-4 (novel security posture, irreversible actions, operator-reserved)
# still escalate — those are NOT configurable.
decision_authority:
  product: decide # escalate | decide. See decision-protocol.md §5.1.

autonomous_delivery:
  enabled: true # master switch. false -> every mode exits in Phase 0 with a report.
  modes: [story, bug, discovery] # modes this project permits. A mode not listed is rejected.
  caps:
    story: 1 # HARD. Measured: every story in the 2026-07-31 run became a 1900-4200 line chain.
    bug: 3 # sequential; each fully closed before the next starts.
    discovery: 0 # application CODE cap — always zero, discovery never writes code.
    discovery_definitions:
      2 # NEW user stories fully drafted + created per run (existing epic, new epic's
      # first stories, or a single urgent story). Created UNATTENDED — the operator vetoes afterwards by
      # closing or deleting the ticket, which the next run reads as a standing ruling. The synchronous
      # chat approval gate was REMOVED 2026-08-18 (operator decision, made live in session): four
      # consecutive fires produced zero backlog work while one proposal sat unanswered, and a story in
      # `Backlog` is cheaper to close than the idle time the gate cost. THIS cap is what bounds the
      # blast radius; the gate never was.
  lock_staleness_minutes: 90 # older than this -> abandoned, reclaimable with a logged note.
  automation_gh_account: saiotest # the `gh` identity this run asserts before every push and every
  # merge (repo admin, write scope). A second local `gh` account (`elycuracity`) is read-only on this
  # repo and, if it becomes the active account mid-run, silently breaks merges while pushes keep
  # succeeding under a separate keychain credential. See SKILL.md Phase 0b step 3 and Hazard H20.
  migrations: unrestricted # confirm | autonomous | unrestricted. `unrestricted` applies EVERY class
  # of migration unattended, including DROP / RENAME / CREATE OR REPLACE rewrites of live objects.
  # Set to `unrestricted` 2026-08-06 (operator decision, made live in session): the shared Supabase
  # project ref (fmbpikzpkafptqximhxn / ADR-0009) backs an MVP still in development, not a real
  # production tenant, and this project is AI-led by design (CLAUDE.md Critical Rule #18) — so gating
  # destructive DDL bought ceremony, not safety. Two rules still bind at every level, `unrestricted`
  # included: never apply a migration merely to clear a local error, and always re-read the live
  # definition after every apply (incl. re-applies) and diff it against the committed file. Reverses
  # to `autonomous` the moment a genuine production tenant is split off this project ref.
  isolation: worktree # worktree | in-place. worktree is strongly preferred.
  context_budget:
    handoff_checkpoint: every-phase # every-phase | every-slice. Never "at-end".
    stop_at_remaining_pct: 20 # begin the clean-stop sequence at this much budget left.
  report_channel:
    tracker:BK-261 # plain run-summary log for all 3 routines. NOT a mailbox — no reply-parsing
    # protocol, nobody replies here and nothing reads a reply. Since 2026-08-18 it is also where the operator
    # SEES what discovery created, which is the input to the veto; the veto itself is the tracker state (close
    # or delete the ticket). See .context/orchestration/routines.md and SKILL.md's Autonomy section.
  escalation_channel: slack:C0BNQQ7EUNM # #claude-routine-blockers (private, upexgalaxy.slack.com). ESCALATIONS
  # ONLY — never run summaries; those stay on report_channel (BK-261) as before. Primary notification path in a
  # story/bug run's clean-stop sequence (see SKILL.md Autonomy); PushNotification remains the secondary path.
  # Posted via the Slack MCP tool (slack_send_message), which authenticates as the operator's own user, not a
  # bot. Wired 2026-08-07 (operator decision, made live in session).
  escalation_log: .session/autonomous-delivery/escalation-log.md # append-only, shared across modes.
