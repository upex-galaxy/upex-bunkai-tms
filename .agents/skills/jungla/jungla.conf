# El Jungla: per-project parameters (bash, sourced by every script in scripts/).
# This is the ONLY file a new project edits to get its own Jungla (`jungla-<project>`):
# copy the skill, change these values, add a launcher config in ~/.upex/aurora/bin/config/.
# No secrets here: credentials are read at runtime from the .env files named below.

JUNGLA_ID="jungla-bunkai"
JUNGLA_PROJECT="bunkai"
JUNGLA_DISPLAY="El Jungla de Bunkai"
JUNGLA_REPO="/Users/ely/Desktop/projects/bunkai/upex-bunkai-tms"
JUNGLA_BRANCH="staging"

# State lives outside git, so it survives a re-clone and never dirties the shared checkout.
JUNGLA_STATE_DIR="$HOME/.upex/jungla/bunkai"
JUNGLA_INBOX="$JUNGLA_STATE_DIR/inbox"            # tutor -> Jungla (student-blocker)
JUNGLA_TUTOR_INBOX="$HOME/.upex/aurora/tutor/inbox" # Jungla -> tutor (answer, review-request)
JUNGLA_BRIDGE_CONTRACT="$HOME/.upex/bridges/tutor-jungla.md"

# Jira: credentials ATLASSIAN_EMAIL / ATLASSIAN_API_TOKEN from the repo .env
JUNGLA_JIRA_SITE="https://upexgalaxy74.atlassian.net"
JUNGLA_JIRA_KEY="BK"
# Everything that can need a gank. The watcher diffs this set against the last pass
# (key -> status), so a standing item wakes the Jungla once, not on every poll.
JUNGLA_GANK_JQL='project = BK AND ((issuetype = Story AND status in ("Ready For Dev", "QA Approved", "BLOCKED")) OR (issuetype in (Bug, Defect) AND status = Open))'
# status -> gank kind (the watcher labels each event with it)
JUNGLA_GANK_KINDS='{"Ready For Dev":"ready-for-dev","QA Approved":"qa-approved","BLOCKED":"blocked","Open":"bug"}'
# Gank 4 (own shift-left): stories no student took in 7 days. Swept by the routine, not the watcher.
JUNGLA_SHIFTLEFT_JQL='project = BK AND issuetype = Story AND status in (Backlog, Estimation, "Shift-Left QA") AND assignee is EMPTY AND updated <= -7d ORDER BY rank'
# Student stock (Q2): stories open for students to take; target ~20, ~10 new per week.
JUNGLA_STOCK_JQL='project = BK AND issuetype = Story AND status in (Backlog, Estimation, "Shift-Left QA", "Ready For Dev")'
JUNGLA_STOCK_TARGET=20

# Slack: the Aurora bot token (SLACK_MCP_BOT_TOKEN) from this .env. Never print it.
JUNGLA_SLACK_ENV="/Users/ely/Desktop/projects/boilerplates/agentic-qa-boilerplate/.env"
JUNGLA_SLACK_CHANNEL_NAME="jungla-bunkai"
JUNGLA_SLACK_CHANNEL_FILE="$JUNGLA_STATE_DIR/slack-channel.id" # written by scripts/slack-channel.sh
JUNGLA_SLACK_PREFIX="🌿 Jungla · Bunkai"
JUNGLA_OWNERS='["U03PG659HLJ","U0434E9EVSB"]' # the two owners, by Slack user id

# Database the Jungla audits and cleans (MVP, shared by every environment, not real production)
JUNGLA_SUPABASE_REF="fmbpikzpkafptqximhxn"

# Day (ART). The launcher config mirrors these hours.
JUNGLA_DAY_END="21:00"
JUNGLA_MAX_WAIT=6600 # the harness kills a background task at 2 h; 6600 s stays under it
