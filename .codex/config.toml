# Codex CLI + Desktop read this same file. Instructions come from AGENTS.md and
# skills from .agents/skills/, both natively — neither needs configuring here.
# The MCP inventory below is the Codex-format adapter of the local servers that
# .mcp.json and opencode.jsonc also declare; `bun run agents:compat:check`
# compares the three semantically, so a server added to one host only fails.
# Web search runs at harness level (~/.codex/config.toml), never here: see
# .agents/skills/agentic-dev-core/references/mcp-capabilities.md.

[shell_environment_policy]
inherit = "core"

# EVERY server below that needs .env values starts through the .env loader:
# `bunx -p varlock@1.20.0 varlock run --no-redact-stdout --inject vars --filter
# A,B -- <the real command>`. Codex Desktop opened from Finder or the Dock has
# no process environment, so the values cannot come from Codex: the loader
# reads the varlock schema plus .env / .env.local (or the secret manager the
# schema names) from the project root whatever launched Codex, and hands the
# server ONLY the variables in its --filter. `--no-redact-stdout` keeps the
# JSON-RPC stream byte-intact (varlock redacts piped output otherwise). No
# `env_vars` beside it: the filter IS the server's dependency list, and
# `bun run agents:compat:check` compares it across the three hosts. Same loader
# on every host: MCP_ENV_LOADER_* in cli/lib/agent-compatibility-contracts.ts
# (ADR-0012). context7 needs no value, so it starts without the loader.
#
# Needs `bun install` once (the varlock devDependency, same exact pin) and a
# .env in the checkout. A value that fails the schema stops the server that
# needs it: `bunx varlock load --agent` shows which, redacted.
#
# `startup_timeout_sec = 30` on each: Codex waits 10 s by default, and a cold
# `bunx` / `npx` fetch plus the loader hop can pass that before the first
# handshake.

[mcp_servers.context7]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-y",
  "@upstash/context7-mcp",
]

# @supabase/mcp-server-supabase reads one variable, SUPABASE_ACCESS_TOKEN (its
# documented fallback when --access-token is absent), so that is the whole
# filter: the project URL and the publishable / secret keys never reach it.
[mcp_servers.supabase]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--inject",
  "vars",
  "--filter",
  "SUPABASE_ACCESS_TOKEN",
  "--",
  "bunx",
  "-y",
  "@supabase/mcp-server-supabase@latest",
]

[mcp_servers.n8n]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--inject",
  "vars",
  "--filter",
  "N8N_API_URL,N8N_API_KEY",
  "--",
  "npx",
  "-y",
  "n8n-mcp",
]

[mcp_servers.n8n.env]
MCP_MODE = "stdio"
LOG_LEVEL = "error"
DISABLE_CONSOLE_OUTPUT = "true"

# Bunkai project-only: Tavily web search ([WEB_SEARCH_TOOL] primary here), stdio
# server reading TAVILY_API_KEY from the .env loader.
[mcp_servers.tavily]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--inject",
  "vars",
  "--filter",
  "TAVILY_API_KEY",
  "--",
  "bunx",
  "-y",
  "tavily-mcp@latest",
]

# Bunkai project-only: browser automation through the Playwright MCP (`--extension`
# attaches to the running browser). No .env dependency.
[mcp_servers.playwright]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "@playwright/mcp@latest",
  "--extension",
]

# Bunkai project-only: DBHub reads dbhub.toml (committed, ${VAR} placeholders only)
# and expands the DBHUB_* variables the loader hands it. Read-only SQL through the
# QA inspector role.
[mcp_servers.dbhub]
command = "bunx"
enabled = true
startup_timeout_sec = 30
args = [
  "-p",
  "varlock@1.20.0",
  "varlock",
  "run",
  "--no-redact-stdout",
  "--inject",
  "vars",
  "--filter",
  "DBHUB_TYPE,DBHUB_HOST,DBHUB_PORT,DBHUB_DATABASE,DBHUB_USER,DBHUB_PASSWORD",
  "--",
  "bunx",
  "-y",
  "@bytebase/dbhub@1.2.3",
  "--config",
  "dbhub.toml",
]
