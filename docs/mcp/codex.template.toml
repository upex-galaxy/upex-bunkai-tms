# ============================================
# TEMPLATE DE MCPs PARA CODEX CLI + CODEX DESKTOP
# ============================================
# Este archivo es una copia DERIVADA de `.codex/config.toml` (commiteado en la
# raíz del repo y verificado en paridad con `.mcp.json` / `opencode.jsonc` por
# `bun run agents:compat:check`) más servidores opt-in que el repo no activa.
#
# Un checkout de este proyecto NO necesita copiar nada: `.codex/config.toml` ya
# trae los cuatro servidores canónicos. Usá este template para:
#   - un config global en ~/.codex/config.toml (fuera de este repo), o
#   - sumar un bloque opt-in a `.codex/config.toml` (y a los otros dos hosts,
#     o el gate de paridad falla).
#
# `.codex/` de proyecto solo se carga en un repositorio trusted.
#
# REGLA DE SECRETOS: Codex NO expande `${VAR}` en `args` ni en `[X.env]`. Los
# secretos viajan POR NOMBRE: `env_vars = ["VAR"]` (stdio) o
# `bearer_token_env_var = "VAR"` (HTTP), y Codex los lee del entorno que
# `bun run codex` carga desde .env. Los `{{VARIABLE}}` de abajo son marcadores
# de búsqueda-y-reemplazo para valores que NO son secretos (URLs, rutas).
#
# IMPORTANTE: Para OAuth en servidores HTTP, habilitar:
# experimental_use_rmcp_client = true

[shell_environment_policy]
inherit = "core"

# ============================================
# SERVIDORES CANÓNICOS (idénticos a .codex/config.toml)
# ============================================

[mcp_servers.context7]
command = "bunx"
enabled = true
args = [
  "-y",
  "@upstash/context7-mcp",
]

# Streamable HTTP con la key como bearer: el túnel mcp-remote que usan
# .mcp.json / opencode.jsonc existe solo para meter ${TAVILY_API_KEY} en la URL,
# y Codex no puede interpolarla ahí.
[mcp_servers.tavily]
url = "https://mcp.tavily.com/mcp/"
bearer_token_env_var = "TAVILY_API_KEY"
enabled = true

# @supabase/mcp-server-supabase lee SUPABASE_ACCESS_TOKEN del entorno cuando
# falta --access-token (fallback documentado), así que el token se reenvía en
# vez de interpolarse. Las otras tres viajan bajo su nombre de .env.
[mcp_servers.supabase]
command = "bunx"
enabled = true
args = [
  "-y",
  "@supabase/mcp-server-supabase@latest",
]
env_vars = [
  "SUPABASE_ACCESS_TOKEN",
  "NEXT_PUBLIC_SUPABASE_URL",
  "SUPABASE_PUBLISHABLE_KEY",
  "SUPABASE_SECRET_KEY",
]

[mcp_servers.n8n]
command = "npx"
enabled = true
args = [
  "-y",
  "n8n-mcp",
]
env_vars = [
  "N8N_API_URL",
  "N8N_API_KEY",
]

[mcp_servers.n8n.env]
MCP_MODE = "stdio"
LOG_LEVEL = "error"
DISABLE_CONSOLE_OUTPUT = "true"

# ============================================
# SERVIDORES OPT-IN (no activos en este repo)
# ============================================
# Copiá el bloque a `.codex/config.toml` y replicalo en .mcp.json y
# opencode.jsonc antes de correr `bun run agents:compat:check`.

[mcp_servers.playwright]
command = "npx"
args = [
  "@playwright/mcp@latest",
  "--caps",
  "vision,pdf,testing,tracing,tabs",
  "--timeout-action",
  "10000",
  "--timeout-navigation",
  "30000",
  "--viewport-size",
  "1920x1080"
]

[mcp_servers.devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp"
]

[mcp_servers.openapi]
command = "npx"
args = [
  "-y",
  "@ivotoby/openapi-mcp-server",
  "--tools",
  "dynamic"
]

# API_HEADERS lleva el bearer dentro del valor y Codex no lo interpola: exportá
# API_HEADERS="Authorization:Bearer <token>" completo en el entorno.
env_vars = [
  "API_HEADERS",
]

[mcp_servers.openapi.env]
API_BASE_URL = "https://staging-upexsoloq.vercel.app/api"
OPENAPI_SPEC_PATH = "https://staging-upexsoloq.vercel.app/api/openapi"

[mcp_servers.sql]
command = "npx"
args = [
  "-y",
  "@bytebase/dbhub@latest",
  "--config",
  "dbhub.toml"
]

[mcp_servers.shadcn]
command = "npx"
args = [
  "-y",
  "shadcn@latest",
  "mcp"
]

[mcp_servers.slack]
command = "npx"
args = [
  "-y",
  "slack-mcp-server@latest",
  "--transport",
  "stdio"
]

env_vars = [
  "SLACK_MCP_XOXP_TOKEN",
]

[mcp_servers.slack.env]
SLACK_MCP_ADD_MESSAGE_TOOL = "true"
SLACK_MCP_USERS_CACHE = "$HOME/.codex/mcp-cache/slack/"
SLACK_MCP_CHANNELS_CACHE = "$HOME/.codex/mcp-cache/slack/"

[mcp_servers.nanobanana]
command = "uvx"
args = [ "nanobanana-mcp-server@latest" ]

env_vars = [
  "GEMINI_API_KEY",
]

# ============================================
# ATLASSIAN - USANDO MCP-REMOTE (RECOMENDADO)
# ============================================
# mcp-remote maneja OAuth automáticamente y funciona con cualquier cliente

[mcp_servers.atlassian]
command = "npx"
args = [
  "-y",
  "mcp-remote",
  "https://mcp.atlassian.com/v1/sse"
]

# ============================================
# SERVIDORES HTTP STREAMABLE (REMOTOS)
# ============================================

[mcp_servers.postman]
url = "https://mcp.postman.com/mcp"
bearer_token_env_var = "POSTMAN_API_KEY"

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp/soloq/typescript"

[mcp_servers.vercel]
url = "https://mcp.vercel.com/"

[mcp_servers.notion]
url = "https://mcp.notion.com/mcp"
